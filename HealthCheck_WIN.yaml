---
- name: Windows Server Health Check
  hosts: all
  gather_facts: yes
  tasks:

    - name: Gather system facts
      ansible.builtin.setup:

    - name: Get list of running services
      win_shell: |
        Get-Service | Where-Object {$_.Status -eq "Running"} | Select-Object Name, DisplayName, Status
      register: running_services

    - name: Save running services to a file
      win_copy:
        content: "{{ running_services.stdout }}"
        dest: "C:\Temp\running_services.txt"

    - name: Display running services
      debug:
        var: running_services.stdout_lines

    - name: Check disk space
      win_shell: |
        Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{Name="Used(GB)";Expression={[math]::round($_.Used/1GB,2)}}, @{Name="Free(GB)";Expression={[math]::round($_.Free/1GB,2)}}, @{Name="Total(GB)";Expression={[math]::round($_.Used/1GB,2) + [math]::round($_.Free/1GB,2)}}
      register: disk_space

    - name: Save disk space to a file
      win_copy:
        content: "{{ disk_space.stdout }}"
        dest: "C:\Temp\disk_space.txt"

    - name: Display disk space
      debug:
        var: disk_space.stdout_lines

    - name: Check CPU usage
      win_shell: |
        Get-WmiObject Win32_Processor | Select-Object LoadPercentage
      register: cpu_usage

    - name: Save CPU usage to a file
      win_copy:
        content: "{{ cpu_usage.stdout }}"
        dest: "C:\Temp\cpu_usage.txt"

    - name: Display CPU usage
      debug:
        var: cpu_usage.stdout_lines

    - name: Check memory usage
      win_shell: |
        Get-WmiObject Win32_OperatingSystem | Select-Object @{Name="TotalVisibleMemorySize(GB)";Expression={[math]::round($_.TotalVisibleMemorySize/1MB,2)}}, @{Name="FreePhysicalMemory(GB)";Expression={[math]::round($_.FreePhysicalMemory/1MB,2)}}
      register: memory_usage

    - name: Save memory usage to a file
      win_copy:
        content: "{{ memory_usage.stdout }}"
        dest: "C:\Temp\memory_usage.txt"

    - name: Display memory usage
      debug:
        var: memory_usage.stdout_lines
