---
- name: Windows Server Health Check
  hosts: "{{ selected_group }}"
  gather_facts: no
  vars:
    local_repo_path: /tmp/WindowsAgent
    repo_url: "https://asker.chan:glpat-3p3-sFSmQJJtRNe5_AZL@gitlab.as1nfra.com/asker.chan/ansible.git"
    

  tasks:

    - name: Get hostname
      win_shell: hostname
      register: hostname_result

    - name: Debug hostname result
      debug:
        var: hostname_result.stdout

    - name: Clean hostname (remove newline)
      set_fact:
        clean_hostname: "{{ hostname_result.stdout | trim }}"


    - name: Debug clean hostname
      debug:
        var: clean_hostname

    - name: Get list of running services
      win_shell: >
        Get-Service | Where-Object {$_.Status -eq "Running"} | Select-Object
        Name, DisplayName, Status
      register: running_services

    - name: Save running services to a file
      win_copy:
        content: "{{ running_services.stdout }}"
        dest: "C:\\Temp\\running_services_{{ clean_hostname }}.txt"

    - name: Display running services
      debug:
        var: running_services.stdout_lines

    - name: Check disk space
      win_shell: >
        Get-PSDrive -PSProvider FileSystem | Select-Object Name,
        @{Name="Used(GB)";Expression={[math]::round($_.Used/1GB,2)}},
        @{Name="Free(GB)";Expression={[math]::round($_.Free/1GB,2)}},
        @{Name="Total(GB)";Expression={[math]::round($_.Used/1GB,2) +
        [math]::round($_.Free/1GB,2)}}
      register: disk_space

    - name: Save disk space to a file
      win_copy:
        content: "{{ disk_space.stdout }}"
        dest: "C:\\Temp\\disk_space_{{ clean_hostname }}.txt"

    - name: Display disk space
      debug:
        var: disk_space.stdout_lines

    - name: Copy files to network share using UNC path
      win_shell: powershell.exe -ExecutionPolicy Bypass -File "C:\Temp\Export.ps1"
      become: true
      become_method: runas
      become_flags: logon_type=new_credentials logon_flags=netcredentials_only

        

    - name: Show copy debug output
      debug:
        var: copy_output.stdout_lines
