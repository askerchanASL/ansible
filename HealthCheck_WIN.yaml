- name: Windows Server Health Check
  hosts: all
  gather_facts: yes
  tasks:

    - name: Gather system facts
      ansible.builtin.setup:

    - name: Get list of running services
      win_shell: |
        Get-Service | Where-Object {$_.Status -eq "Running"} | Select-Object Name, DisplayName, Status
      register: running_services

    - name: Save running services to a file
      win_copy:
        content: "{{ running_services.stdout }}"
        dest: "c:\\Temp\\running_services.txt"

    - name: Display running services
      debug:
        var: running_services.stdout_lines

    - name: Check disk space
      win_shell: |
        Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{Name="Used(GB)";Expression={[math]::round($_.Used/1GB,2)}}, @{Name="Free(GB)";Expression={[math]::round($_.Free/1GB,2)}}, @{Name="Total(GB)";Expression={[math]::round($_.Used/1GB,2) + [math]::round($_.Free/1GB,2)}}
      register: disk_space

    - name: Save disk space to a file
      win_copy:
        content: "{{ disk_space.stdout }}"
        dest: "c:\\Temp\\disk_space.txt"

    - name: Display disk space
      debug:
        var: disk_space.stdout_lines

    - name: Copy files to network share using UNC path
      win_shell: |
        $username = "DOMAIN\\username"
        $password = ConvertTo-SecureString "your_password" -AsPlainText -Force
        $cred = New-Object System.Management.Automation.PSCredential($username, $password)

        $session = New-PSSession -ComputerName 172.16.17.40 -Credential $cred
        Invoke-Command -Session $session -ScriptBlock {
          Copy-Item -Path "C:\Temp\running_services.txt" -Destination "\\172.16.17.40\patch\running_services.txt" -Force
          Copy-Item -Path "C:\Temp\disk_space.txt" -Destination "\\172.16.17.40\patch\disk_space.txt" -Force
        }
        Remove-PSSession -Session $session



