- name: Read AES key
  set_fact:
    aes_key: "{{ lookup('file', playbook_dir + '/AES.key') }}"

- name: Read encrypted password
  set_fact:
    encrypted_pass: "{{ lookup('file', playbook_dir + '/pass.txt') }}"

- name: Decrypt password
  set_fact:
    decrypted_pass: "{{ encrypted_pass | custom_decrypt(aes_key) }}"

- name: Create local user
  win_user:
    name: mylocaluser
    password: "{{ decrypted_pass }}"
    state: present
