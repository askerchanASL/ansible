---
- name: Change password for same account on Windows
  hosts: "{{ selected_group }}"
  gather_facts: no
  vars:
    username: "{{ survey_username }}"
    new_password: "{{ survey_password }}"
  tasks:
    - name: Debug username only (hide password for security)
      ansible.builtin.debug:
        msg: "Changing password for user '{{ username }}'"

    - name: Change password using net user
      ansible.windows.win_shell: |
        net user "{{ username }}" "{{ new_password }}"
