---
- name: Create Windows local account using PowerShell-encrypted password
  hosts: all
  gather_facts: no
  tasks:
    - name: Copy AES key to Windows
      win_copy:
        src: "{{ playbook_dir }}/AES.key"
        dest: "C:\\temp\\AES.key"

    - name: Copy encrypted password to Windows
      win_copy:
        src: "{{ playbook_dir }}/pass.txt"
        dest: "C:\\temp\\pass.txt"

    - name: Decrypt password using PowerShell
      win_shell: |
        $SecureString = Get-Content "C:\\temp\\pass.txt" | ConvertTo-SecureString
        $Key = Get-Content "C:\\temp\\AES.key"
        $PlainText = [System.Runtime.InteropServices.Marshal]::PtrToStringAuto(
            [System.Runtime.InteropServices.Marshal]::SecureStringToBSTR($SecureString)
        )
        Write-Output $PlainText
      register: decrypted_password

    - name: Create local user
      win_user:
        name: mylocaluser
        password: "{{ decrypted_password.stdout }}"
        state: present
