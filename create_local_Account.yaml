---
- name: Create Windows local account using AES-encrypted password
  hosts: all
  gather_facts: no
  tasks:
    - name: Copy AES key to target
      win_copy:
        src: "{{ playbook_dir }}/AES.key"
        dest: "C:\\temp\\AES.key"

    - name: Copy encrypted password to target
      win_copy:
        src: "{{ playbook_dir }}/pass.txt"
        dest: "C:\\temp\\Pass2.txt"

    - name: Decrypt password and create user
      win_shell: |
        $Key = Get-Content "C:\\temp\\AES.key"
        $EncryptedPassword = Get-Content "C:\\temp\\Pass2.txt"
        $SecurePassword = ConvertTo-SecureString $EncryptedPassword -Key $Key
        $PlainText = [System.Net.NetworkCredential]::new("", $SecurePassword).Password

        if (-not (Get-LocalUser -Name "mylocaluser")) {
            net user mylocaluser $PlainText /add
        }
      args:
        executable: powershell

    - name: Remove AES key file
      win_file:
        path: "C:\\temp\\AES.key"
        state: absent

    - name: Remove encrypted password file
      win_file:
        path: "C:\\temp\\Pass2.txt"
        state: absent
