---
- name: Create Windows local account using AES-encrypted password
  hosts: all
  gather_facts: no
  tasks:
    - name: Copy AES key to target
      win_copy:
        src: "{{ playbook_dir }}/AES.key"
        dest: "C:\\temp\\AES.key"

    - name: Copy encrypted password to target
      win_copy:
        src: "{{ playbook_dir }}/pass.txt"
        dest: "C:\\temp\\pass.txt"

    - name: Decrypt password and create user
      win_shell: |
        Add-Type -AssemblyName System.Security
        Add-Type -AssemblyName System.Runtime.InteropServices

        # Read key and encrypted password
        $Key = Get-Content "C:\\temp\\AES.key"
        $Encrypted = Get-Content "C:\\temp\\pass.txt"

        # Convert Base64 to bytes
        $EncryptedBytes = [Convert]::FromBase64String($Encrypted)

        # Create AES object
        $AES = [System.Security.Cryptography.AesManaged]::new()
        $AES.Mode = [System.Security.Cryptography.CipherMode]::ECB
        $AES.Padding = [System.Security.Cryptography.PaddingMode]::PKCS7
        $AES.Key = [Text.Encoding]::UTF8.GetBytes($Key)

        # Decrypt
        $Decryptor = $AES.CreateDecryptor()
        $PlainBytes = $Decryptor.TransformFinalBlock($EncryptedBytes, 0, $EncryptedBytes.Length)
        $PlainText = [Text.Encoding]::UTF8.GetString($PlainBytes)

        # Create local user
        net user mylocaluser $PlainText /add
      args:
        executable: powershell

    
    - name: Remove AES key file
      win_file:
        path: "C:\\temp\\AES.key"
        state: absent

    - name: Remove encrypted password file
      win_file:
        path: "C:\\temp\\pass.txt"
        state: absent
