---
- name: Example Playbook
  hosts: all
  vars:
    ansible_user: "{{ selected_credential.username | default('') }}"
    ansible_password: "{{ selected_credential.password | default('') }}"
    ansible_connection: winrm
    ansible_port: 5986
  tasks:
    - name: Debug to verify credentials
      debug:
        msg:
          - "Selected Credential: {{ selected_credential }}"
          - "Resolved User: {{ ansible_user }}"
          - "Resolved Password: {{ '******' if ansible_password else 'Not Set' }}"

    - name: Get hostname
      win_shell: hostname
      register: hostname_result

    - name: Show hostname
      debug:
        var: hostname_result.stdout
