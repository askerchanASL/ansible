- name: Gather system info and export to SMB share using CIFS
  hosts: "{{ selected_host }}"
  become: yes
  gather_facts: false

  vars:
    output_file: "/tmp/running_services_{{ inventory_hostname }}.txt"
    smb_share: "//172.16.17.40/Patch"
    smb_mount: "/mnt/patch_share"
    smb_user: "administrator@dev.local"
    smb_pass: "P@ssw0rd"

  tasks:
    - name: Get running services
      shell: systemctl list-units --type=service --state=running
      register: running_services

    - name: Get disk space usage
      shell: df -h
      register: disk_usage

    - name: Combine output
      set_fact:
        combined_output: |
          Running Services:
          {{ running_services.stdout }}

          Disk Usage:
          {{ disk_usage.stdout }}

    - name: Save output to local file on control node
      delegate_to: localhost
      copy:
        content: "{{ combined_output }}"
        dest: "{{ output_file }}"

    - name: Ensure mount point exists
      delegate_to: localhost
      become: true
      file:
        path: "{{ smb_mount }}"
        state: directory

    - name: Mount SMB share using CIFS
      delegate_to: localhost
      become: true
      mount:
        path: "{{ smb_mount }}"
        src: "{{ smb_share }}"
        fstype: cifs
        opts: "username={{ smb_user }},password={{ smb_pass }},vers=3.0"
        state: mounted

    - name: Copy file to mounted SMB share
      delegate_to: localhost
      become: true
      copy:
        src: "{{ output_file }}"
        dest: "{{ smb_mount }}/running_services_{{ inventory_hostname }}.txt"
        remote_src: no

    - name: Unmount SMB share
      delegate_to: localhost
      become: true
      mount:
        path: "{{ smb_mount }}"
        state: unmounted
