- name: Clone only LinuxAgent directory on AAP server
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    repo_url: "https://{{git_user}}:{{git_password}}@gitlab.as1nfra.com/asker.chan/ansible.git"
    repo_dest: "/tmp/ME"
    sparse_dir: "LinuxAgent"


- name: Install UEMS Linux Agent on target machines
  hosts: "{{ selected_group| default('all') }}"
  ansible_connection: ssh
  ansible_ssh_host_key_checking: false
  become: true
  vars:
    repo_dest: "/tmp/ME"

  tasks:


    - name: Make UEMS_LinuxAgent.bin executable
      ansible.builtin.file:
        path: "{{ repo_dest }}/AutoInstall.sh"
        mode: '0755'

    - name: Run the installer
      ansible.builtin.command:
        cmd: "./AutoInstall.sh"
        chdir: "{{ repo_dest }}"


