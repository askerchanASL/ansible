---
- name: Clone LinuxAgent directory on AAP server
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    repo_url: "https://{{ git_username }}:{{ git_token }}@gitlab.as1nfra.com/askerchan/ansible.git"
    repo_dest: "/tmp/ME"
    sparse_dir: "LinuxAgent"

  pre_tasks:
    - name: Load GitLab credentials from vault
      delegate_to: localhost
      run_once: true
      ansible.builtin.include_vars:
        file: vault.yml

  tasks:
    - name: Ensure destination directory exists
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        state: directory

    - name: Initialize empty Git repo
      ansible.builtin.command:
        cmd: "git init"
        chdir: "{{ repo_dest }}"

    - name: Set remote origin
      ansible.builtin.command:
        cmd: "git remote add origin {{ repo_url }}"
        chdir: "{{ repo_dest }}"

    - name: Enable sparse checkout
      ansible.builtin.command:
        cmd: "git config core.sparseCheckout true"
        chdir: "{{ repo_dest }}"

    - name: Define sparse-checkout paths
      ansible.builtin.copy:
        dest: "{{ repo_dest }}/.git/info/sparse-checkout"
        content: |
          {{ sparse_dir }}

    - name: Pull only the specified directory
      ansible.builtin.command:
        cmd: "git pull origin main"
        chdir: "{{ repo_dest }}"

- name: Clone WindowsAgent directory on AAP server
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    repo_url: "https://{{ git_username }}:{{ git_token }}@gitlab.as1nfra.com/askerchan/ansible.git"
    local_repo_path: "/tmp/WindowsAgent"

  pre_tasks:
    - name: Load GitLab credentials from vault
      delegate_to: localhost
      run_once: true
      ansible.builtin.include_vars:
        file: vault.yml

  tasks:
    - name: Ensure local repo directory is clean
      ansible.builtin.file:
        path: "{{ local_repo_path }}"
        state: absent

    - name: Clone repo with sparse checkout enabled
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ local_repo_path }}"
        version: main
        depth: 1
        single_branch: yes
        accept_hostkey: yes
      environment:
        GIT_SPARSE_CHECKOUT_CONE: "true"
      register: git_clone_result

    - name: Set sparse-checkout path to WindowsAgent
      ansible.builtin.command:
        cmd: git sparse-checkout set WindowsAgent
        chdir: "{{ local_repo_path }}"
      when: git_clone_result.changed

- name: Cross-platform Patch Manager Agent Installation
  hosts: "{{ selected_group }}"
  gather_facts: yes
  vars:
    min_cpu_threads: 2
    min_memory_gb: 4
    min_disk_gb: 5
    min_ram_gb: 4
    min_space_gb: 5
    ansible_user: "{{ ansible_user }}"
    ansible_password: "{{ ansible_password }}"
    ansible_become_password: "{{ ansible_password }}"

    #Server
    UATPMP: "172.31.242.51"
    IFCOAUATDS: "172.31.242.54"
    IFCDMZUATDS: "172.22.107.63"
    KCCOAUATDS: "172.31.242.62"
    KCCDMZUAT: "172.22.108.63"
    LZInternalUATDS: "172.17.13.24"
    LZDMZUATDS: "172.17.12.83"
    PRDPMP: "172.31.242.50"
    IFCOAPRDDS: "172.31.242.53"
    IFCDMZPRDDS: "172.22.105.63"
    KCCOAPRDDS: "172.31.242.61"
    KCCDMZPRDDS: "172.22.106.63"
    LZInternalPRDDS: "172.18.13.10"
    LZDMZPRDDS: "172.18.12.84"
    

    # Windows-specific
    csv_file_win: "C:\\TEMP\\UEMSAgent\\WindowsAgent\\site_map.csv"
    installers:
      LocalOffice: "LocalOffice_Agent.exe"
      TestOffice: "TestOffice_Agent.exe"
      IFCOAPRD: "IFCOAPRD_Agent.exe"
      IFCDMZPRD: "IFCDMZPRD_Agent.exe"
      KCCOAPRD: "KCCOAPRD_Agent.exe"
      KCCDMZPRD: "KCCDMZPRD_Agent.exe"
      LZInternalPRD: "LZInternalPRD_Agent.exe"
      LZDMZPRD: "LZDMZPRD_Agent.exe"
      IFCOAUAT: "IFCOAUAT_Agent.exe"
      IFCDMZUAT: "IFCDMZUAT_Agent.exe"
      KCCOAUAT: "KCCOAUAT_Agent.exe"
      KCCDMZUAT: "KCCDMZUAT_Agent.exe"
      LZInternalUAT: "LZInternalUAT_Agent.exe"
      LZDMZUAT: "LZDMZUAT_Agent.exe"
    team_day_map:
      ITAS1: "1"
      ITAS2: "2"
      ITDP: "3"
      ITDP-CSP: "4"
      HKFMI: "5"
      ITIS: "6"
      PSM: "0"
    registry_paths:
      patch: 'HKLM:\SOFTWARE\WOW6432Node\AdventNet\DesktopCentral\DCAgent\Patch'
      agent: 'HKLM:\SOFTWARE\WOW6432Node\AdventNet\DesktopCentral\DCAgent'
    install_dir_win: "C:\\TEMP\\UEMSAgent\\WindowsAgent"
    local_repo_path: "/tmp/WindowsAgent"

    # Linux-specific
    csv_file_linux: /tmp/site_map.csv
    install_dir_linux: /tmp/ME
    service_file: /etc/systemd/system/dcservice.service
    site_mapping:
      IFCOAUAT: /tmp/IFCOAUAT_UEMSLinuxAgent.zip
      IFCDMZUAT: /tmp/IFCDMZUAT_UEMSLinuxAgent.zip
      KCCOAUAT: /tmp/KCCOAUAT_UEMSLinuxAgent.zip
      KCCDMZUAT: /tmp/KCCDMZUAT_UEMSLinuxAgent.zip
      IFCOAPRD: /tmp/IFCOAPRD_UEMSLinuxAgent.zip
      IFCDMZPRD: /tmp/IFCDMZPRD_UEMSLinuxAgent.zip
      KCCOAPRD: /tmp/KCCOAPRD_UEMSLinuxAgent.zip
      KCCDMZPRD: /tmp/KCCDMZPRD_UEMSLinuxAgent.zip
      LZInternalUAT: /tmp/LZInternalUAT_UEMSLinuxAgent.zip
      LZDMZUAT: /tmp/LZDMZUAT_UEMSLinuxAgent.zip
      LZInternalPRD: /tmp/LZInternalPRD_UEMSLinuxAgent.zip
      LZDMZPRD: /tmp/LZDMZPRD_UEMSLinuxAgent.zip

  tasks:

    - name: Run Windows tasks
      when: ansible_os_family == 'Windows'
      block:

        - name: Check CPU threads
          win_shell: |
            $cpu = Get-CimInstance -ClassName Win32_Processor
            $cpu | ForEach-Object { $_.NumberOfLogicalProcessors }
          register: cpu_threads

        - name: Calculate Total CPU threads
          set_fact:
            total_threads: "{{ cpu_threads.stdout_lines | map('int') | sum }}"

        - name: Check memory
          win_shell: "[math]::Round((Get-WmiObject -Class Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 0)"
          register: total_memory

        - name: Check disk space
          win_shell: "(Get-WmiObject -Class Win32_LogicalDisk -Filter \"DeviceID='C:'\").FreeSpace / 1GB"
          register: free_space

        - name: Fail if system resources are insufficient (Windows)
          fail:
            msg: |
              System does not meet minimum requirements.
              Required CPU: {{ min_cpu_threads }} threads, Available: {{ total_threads }}
              Required Memory: {{ min_memory_gb }} GB, Available: {{ total_memory }} GB
              Required Disk space: {{ min_disk_gb }} GB, Available: {{ free_space }} GB
              
          when: total_threads | int < min_cpu_threads or
                total_memory.stdout | int < min_memory_gb or
                free_space.stdout | int < min_disk_gb

        - name: Create installation directory on Windows
          win_file:
            path: "{{ install_dir_win }}"
            state: directory

        - name: Copy all installation files to Windows
          win_copy:
            src: "{{ local_repo_path }}/WindowsAgent"
            dest: C:\\TEMP\\UEMSAgent
            recurse: yes

        - name: Read site_map.csv and find site/team
          win_shell: |
            $csv = Import-Csv "{{ csv_file_win }}"
            $hostname = $env:COMPUTERNAME
            $ips = Get-NetIPAddress -AddressFamily IPv4 | Select-Object -ExpandProperty IPAddress
            $match = $csv | Where-Object { $_.ComputerName -eq $hostname -or $ips -contains $_.IPAddress }
            if ($match) {
              Write-Output "$($match.SiteCode),$($match.TeamName)"
            }
          register: site_info

        - name: Parse site and team
          set_fact:
            site: "{{ site_info.stdout.split(',')[0] }}"
            team: "{{ site_info.stdout.split(',')[1] }}"
          when: site_info.stdout != ""

        - name: Fail if no match found
          fail:
            msg: "No matching IP or computer name found in site_map.csv."
          when: site_info.stdout == ""

        - name: Run installer
          win_command: "{{ installers[site] }} /silent"
          args:
            chdir: "{{ install_dir_win }}"
          register: install_result
          ignore_errors: yes

        - name: Clean up team name
          set_fact:
            team_clean: "{{ team | trim }}"

        - name: Clean up Site Code
          set_fact:
            site_clean: "{{ site | trim }}"

        - name: Set registry values if install succeeded
          when: install_result.rc == 0
          block:
            - name: Set DBSyncScanDays
              win_regedit:
                path: "{{ registry_paths.patch }}"
                name: DBSyncScanDays
                data: "{{ team_day_map[team_clean] }}"
                type: string

            - name: Set DBSyncScanTime
              win_regedit:
                path: "{{ registry_paths.patch }}"
                name: DBSyncScanTime
                data: "01:00-04:00"
                type: string

            - name: Set DEFAULTCPUFACTOR
              win_regedit:
                path: "{{ registry_paths.agent }}"
                name: DEFAULTCPUFACTOR
                data: 2
                type: dword

            - name: Set DisableDailyScan
              win_regedit:
                path: "{{ registry_paths.patch }}"
                name: DisableDailyScan
                data: 1
                type: dword

            
            - name: Remove a folder regardless of contents
              win_file:
                path: "C:\\TEMP\\UEMSAgent"
                state: absent

            - name: Set target IP based on site_code
              set_fact:
                win_target_ip: >-
                  {% if site_clean == 'IFCOAUAT' %}
                    {{ UATPMP }}
                  {% elif site_clean == 'IFCOAPRD' %}
                    {{ PRDPMP }}
                  {% elif site_clean == 'IFCDMZUAT' %}
                    {{ UATPMP }}
                  {% elif site_clean == 'IFCDMZPRD' %}
                    {{ PRDPMP }}
                  {% elif site_clean == 'KCCOAUAT' %}
                    {{ UATPMP }}
                  {% elif site_clean == 'KCCOAPRD' %}
                    {{ PRDPMP }}
                  {% elif site_clean == 'KCCDMZUAT' %}
                    {{ UATPMP }}
                  {% elif site_clean == 'KCCDMZPRD' %}
                    {{ PRDPMP }}
                  {% elif site_clean == 'LZInternalUAT' %}
                    {{ UATPMP }}
                  {% elif site_clean == 'LZInternalPRD' %}
                    {{ PRDPMP }}
                  {% elif site_clean == 'LZDMZUAT' %}
                    {{ UATPMP }}
                  {% elif site_clean == 'LZDMZPRD' %}
                    {{ PRDPMP }}
                  {% else %}
                    ""
                  {% endif %}
              
            - name: Clean Target IP
              set_fact:
                win_target_ip: "{{ win_target_ip | trim}}"

            - name: PMP Service port Checking
              win_wait_for: 
                host: "{{ win_target_ip }}"
                port: "{{ item }}"
                timeout: 5
              loop:
                - 8383
                - 8027
              register: win_port_check_results

            - name: Set DS server IP based on site_code
              set_fact:                
                win_ds_server_ip: >-
                  {% if site == 'IFCOAUAT' %}
                    {{ IFCOAUATDS }}
                  {% elif site == 'IFCOAPRD' %}
                    {{ IFCOAPRDDS }}
                  {% elif site == 'IFCDMZUAT' %}
                    {{ IFCDMZUATDS }}
                  {% elif site == 'IFCDMZPRD' %}
                    {{ IFCDMZPRDDS }}
                  {% elif site == 'KCCOAUAT' %}
                    {{ KCCOAUATDS }}
                  {% elif site == 'KCCOAPRD' %}
                    {{ KCCOAPRDDS }}
                  {% elif site == 'KCCDMZUAT' %}
                    {{ KCCDMZUAT }}
                  {% elif site == 'KCCDMZPRD' %}
                    {{ KCCDMZPRDDS }}
                  {% elif site == 'LZInternalUAT' %}
                    {{ LZInternalUATDS }}
                  {% elif site == 'LZInternalPRD' %}
                    {{ LZInternalPRDDS }}
                  {% elif site == 'LZDMZUAT' %}
                    {{ LZDMZUATDS }}
                  {% elif site == 'LZDMZPRD' %}
                    {{ LZDMZPRDDS }}
                  {% else %}
                    ""
                  {% endif %}

            - name: Clean DS IP
              set_fact:
                win_ds_server_ip: "{{ win_ds_server_ip | trim}}"

            - name: DS Service port Checking
              win_wait_for: 
                host: "{{ win_ds_server_ip }}"
                port: 8384
                timeout: 5
              register: win_ds_port_check


        - name: Output summary
          debug:
            msg: >
              vCPU: {{ cpu_threads.stdout }} Thread
              Memory: {{ total_memory.stdout | int }} GB
              FreeSpace: {{ free_space.stdout | int }} GB
              Site: {{ site }}
              Team: {{ team }}
              Installation {{ 'succeeded' if install_result.rc == 0 else 'failed' }}

    - name: Run Linux tasks
      when: ansible_os_family != 'Windows'
      become: yes
      block:


        - name: Check CPU threads
          command: sudo nproc
          register: cpu_threads_result

        - name: Check Memory
          set_fact:
            ram_output: "{{ (ansible_memtotal_mb / 1024) | round }}"
          
         
        - name: Check disk space
          command: df --output=avail -BG /
          register: disk_output
          
        - name: Parse disk space
          set_fact: 
            free_space_gb: "{{ disk_output.stdout_lines[1] | regex_replace('[^0-9]', '') | int }}"

        - name: Fail if system resources are insufficient (Linux)
          fail:
            msg: |
              System does not meet minimum requirements.
              Required CPU: {{ min_cpu_threads }} threads, Available: {{ cpu_threads_result.stdout }}
              Required Memory: {{ min_ram_gb }} GB, Available: {{ (ansible_memtotal_mb / 1024) | round }} GB
              Required Disk space: {{ min_space_gb }} GB, Available: {{ free_space_gb }} GB
          when: cpu_threads_result.stdout | int <  min_cpu_threads or
                ram_output | int < min_ram_gb or
                free_space_gb | int < min_space_gb | int

        - name: Copy UEMS Linux Agent to target
          ansible.builtin.copy:
            src: "/tmp/ME/LinuxAgent/"
            dest: "{{ install_dir_linux }}"
            mode: '0755'
            owner: root
            group: root
            remote_src: no

        - name: Get hostname and IP
          set_fact:
            hostname: "{{ ansible_hostname }}"
            ip_address: "{{ ansible_default_ipv4.address }}"

        - name: Read site code by hostname
          command: awk -F, -v host="{{ hostname }}" '$1 == host {print $3}' {{ csv_file_linux }}
          register: site_code_result
          changed_when: false
          failed_when: false

        - name: Read site code by IP if hostname not found
          command: awk -F, -v ip="{{ ip_address }}" '$2 == ip {print $3}' {{ csv_file_linux }}
          register: site_code_result_ip
          changed_when: false
          when: site_code_result.stdout == ""

        - name: Set site code
          set_fact:
            site_code: >-
              {{ 
              (site_code_result.stdout | trim)
                  if site_code_result.stdout != ""
                  else (site_code_result_ip.stdout | trim)
              }}

        - name: Get site zip file
          set_fact:
            site_path: "{{ site_mapping[site_code] | default('') }}"

        - name: Fail if site zip not found
          fail:
            msg: No installation package mapped for site code '{{ site_code }}'.
          when: site_path == ""

        - name: Unzip package
          unarchive:
            src: "{{ site_path }}"
            dest: "{{ install_dir_linux }}"
            remote_src: yes

        - name: Make installer executable
          file:
            path: "{{ install_dir_linux }}/UEMS_LinuxAgent.bin"
            mode: '0755'
            state: file

        - name: Run installer
          command: "{{ install_dir_linux }}/UEMS_LinuxAgent.bin -f"
          args:
            chdir: "{{ install_dir_linux }}"

        - name: Modify systemd service
          block:
            - name: Ensure service file exists
              stat:
                path: "{{ service_file }}"
              register: service_stat

            - name: Fail if service file missing
              fail:
                msg: "Service file not found: {{ service_file }}"
              when: not service_stat.stat.exists

            - name: Update or insert CPUQuota
              lineinfile:
                path: "{{ service_file }}"
                regexp: ^CPUQuota=
                line: CPUQuota=50%
                insertafter: ^\[Service\]

            - name: Reload systemd
              systemd:
                daemon_reload: yes

            - name: Restart service
              systemd:
                name: dcservice.service
                state: restarted

        - name: Cleanup installation directory
          file:
            path: "{{ install_dir_linux }}"
            state: absent
      
        - name: Set target IP based on site_code
          set_fact:
            target_ip: >-
              {% if site_code == 'IFCOAUAT' %}
                {{ UATPMP }}
              {% elif site_code == 'IFCOAPRD' %}
                {{ PRDPMP }}
              {% elif site_code == 'IFCDMZUAT' %}
                {{ UATPMP }}
              {% elif site_code == 'IFCDMZPRD' %}
                {{ PRDPMP }}
              {% elif site_code == 'KCCOAUAT' %}
                {{ UATPMP }}
              {% elif site_code == 'KCCOAPRD' %}
                {{ PRDPMP }}
              {% elif site_code == 'KCCDMZUAT' %}
                {{ UATPMP }}
              {% elif site_code == 'KCCDMZPRD' %}
                {{ PRDPMP }}
              {% elif site_code == 'LZInternalUAT' %}
                {{ UATPMP }}
              {% elif site_code == 'LZInternalPRD' %}
                {{ PRDPMP }}
              {% elif site_code == 'LZDMZUAT' %}
                {{ UATPMP }}
              {% elif site_code == 'LZDMZPRD' %}
                {{ PRDPMP }}
              {% else %}
                ""
              {% endif %}
              
        - name: Clean Target IP
          set_fact:
            target_ip: "{{ target_ip | trim}}"

        - name: PMP Service port Checking
          wait_for: 
            host: "{{ target_ip }}"
            port: "{{ item }}"
            timeout: 5
          loop:
            - 8383
            - 8027
          register: port_check_results

        - name: Set DS server IP based on site_code
          set_fact:
            ds_server_ip: >-
              {% if site_code == 'IFCOAUAT' %}
                {{ IFCOAUATDS }}
              {% elif site_code == 'IFCOAPRD' %}
                {{ IFCOAPRDDS }}
              {% elif site_code == 'IFCDMZUAT' %}
                {{ IFCDMZUATDS }}
              {% elif site_code == 'IFCDMZPRD' %}
                {{ IFCDMZPRDDS }}
              {% elif site_code == 'KCCOAUAT' %}
                {{ KCCOAUATDS }}
              {% elif site_code == 'KCCOAPRD' %}
                {{ KCCOAPRDDS }}
              {% elif site_code == 'KCCDMZUAT' %}
                {{ KCCDMZUAT }}
              {% elif site_code == 'KCCDMZPRD' %}
                {{ KCCDMZPRDDS }}
              {% elif site_code == 'LZInternalUAT' %}
                {{ LZInternalUATDS }}
              {% elif site_code == 'LZInternalPRD' %}
                {{ LZInternalPRDDS }}
              {% elif site_code == 'LZDMZUAT' %}
                {{ LZDMZUATDS }}
              {% elif site_code == 'LZDMZPRD' %}
                {{ LZDMZPRDDS }}
              {% else %}
                ""
              {% endif %}

        - name: Clean DS IP
          set_fact:
            ds_server_ip: "{{ ds_server_ip | trim}}"

        - name: DS Service port Checking
          wait_for: 
            host: "{{ ds_server_ip }}"
            port: 8384
            timeout: 5


        
        





        
