---
- name: Cross-platform Patch Manager Agent Installation
  hosts: "{{ selected_group }}"
  gather_facts: yes
  become: yes

  collections:
    - community.general

  vars:
    # Shared or OS-specific variables
    min_cpu_threads: 2
    min_memory_gb: 4
    min_disk_gb: 10
    min_ram_gb: 3.5
    min_space_gb: 5

    # Windows-specific
    csv_file_win: "C:\\Temp\\AN\\site_map.csv"
    installers:
      LocalOffice: "LocalOffice_Agent.exe"
      TestOffice: "TestOffice_Agent.exe"
    team_day_map:
      ITAS1: "1"
      ITAS2: "2"
      ITDP: "3"
      ITDP-CSP: "4"
      HKFMI: "5"
      ITIS: "6"
      PSM: "0"
    registry_paths:
      patch: 'HKLM:\SOFTWARE\WOW6432Node\AdventNet\DesktopCentral\DCAgent\Patch'
      agent: 'HKLM:\SOFTWARE\WOW6432Node\AdventNet\DesktopCentral\DCAgent'

    # Linux-specific
    csv_file_linux: /tmp/site_map.csv
    install_dir: /tmp/ME
    service_file: /etc/systemd/system/dcservice.service
    site_mapping:
      IFCOAUAT: /tmp/IFCOAUAT_UEMSLinuxAgent.zip
      IFCDMZUAT: /tmp/IFCDMZUAT_UEMSLinuxAgent.zip
      KCCOAUAT: /tmp/KCCOAUAT_UEMSLinuxAgent.zip
      KCCDMZUAT: /tmp/KCCDMZUAT_UEMSLinuxAgent.zip
      IFCOAPRD: /tmp/IFCOAPRD_UEMSLinuxAgent.zip
      IFCDMZPRD: /tmp/IFCDMZPRD_UEMSLinuxAgent.zip
      KCCOAPRD: /tmp/KCCOAPRD_UEMSLinuxAgent.zip
      KCCDMZPRD: /tmp/KCCDMZPRD_UEMSLinuxAgent.zip
      LZInternalUAT: /tmp/LZInternalUAT_UEMSLinuxAgent.zip
      LZDMZUAT: /tmp/LZDMZUAT_UEMSLinuxAgent.zip
      LZInternalPRD: /tmp/LZInternalPRD_UEMSLinuxAgent.zip
      LZDMZPRD: /tmp/LZDMZPRD_UEMSLinuxAgent.zip

  tasks:

    - name: Run Windows tasks
      when: ansible_os_family == 'Windows'
      block:
            - name: Check CPU threads
      win_shell: "(Get-WmiObject -Class Win32_Processor).NumberOfLogicalProcessors"
      register: cpu_threads

    - name: Check memory
      win_shell: "[math]::Round((Get-WmiObject -Class Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 0)"
      register: total_memory

    - name: Check disk space
      win_shell: "(Get-WmiObject -Class Win32_LogicalDisk -Filter \"DeviceID='C:'\").FreeSpace / 1GB"
      register: free_space

    - name: Fail if system resources are insufficient
      fail:
        msg: "System does not meet minimum requirements."
      when: cpu_threads.stdout | int < min_cpu_threads or
            total_memory.stdout | int < min_memory_gb or
            free_space.stdout | int < min_disk_gb

    - name: Read site_map.csv and find site/team
      win_shell: |
        $csv = Import-Csv "{{ csv_file }}"
        $hostname = $env:COMPUTERNAME
        $ips = Get-NetIPAddress -AddressFamily IPv4 | Select-Object -ExpandProperty IPAddress
        $match = $csv | Where-Object { $_.ComputerName -eq $hostname -or $ips -contains $_.IPAddress }
        if ($match) {
          Write-Output "$($match.SiteCode),$($match.TeamName)"
        }
      register: site_info

    - name: Parse site and team
      set_fact:
        site: "{{ site_info.stdout.split(',')[0] }}"
        team: "{{ site_info.stdout.split(',')[1] }}"
      when: site_info.stdout != ""

    - name: Fail if no match found
      fail:
        msg: "No matching IP or computer name found in site_map.csv."
      when: site_info.stdout == ""

    - name: Run installer
      win_command: "{{ installers[site] }} /silent"
      args:
        chdir: "C:\\TEMP\\AN"
      register: install_result
      ignore_errors: yes

    - name: Clean up team name
      set_fact:
        team_clean: "{{ team | trim }}"

    - name: Set registry values if install succeeded
      block:
        - name: Set DBSyncScanDays
          win_regedit:
            path: "{{ registry_paths.patch }}"
            name: DBSyncScanDays
            data: "{{ team_day_map[team_clean] }}"
            type: string

        - name: Set DBSyncScanTime
          win_regedit:
            path: "{{ registry_paths.patch }}"
            name: DBSyncScanTime
            data: "01:00-04:00"
            type: string

        - name: Set DEFAULTCPUFACTOR
          win_regedit:
            path: "{{ registry_paths.agent }}"
            name: DEFAULTCPUFACTOR
            data: 2
            type: dword

        - name: Set DisableDailyScan
          win_regedit:
            path: "{{ registry_paths.patch }}"
            name: DisableDailyScan
            data: 1
            type: dword
            when: install_result.rc == 0

        - name: Output summary
          debug:
            msg: >
              vCPU: {{ cpu_threads.stdout }} Thread
              Memory: {{ total_memory.stdout | int }} GB
              FreeSpace: {{ free_space.stdout | int }} GB
              Site: {{ site }}
              Team: {{ team }}
              Installation {{ 'succeeded' if install_result.rc == 0 else 'failed' }}
        # [Insert all Windows tasks here, replacing csv_file with csv_file_win]
        # (Omitted here for brevity — already provided above)

    - name: Run Linux tasks
      when: ansible_os_family != 'Windows'
      block:
        - name: Check CPU threads
          command: nproc
          register: cpu_threads_result
          changed_when: false

        - name: Assert CPU threads
          assert:
            that: cpu_threads_result.stdout | int >= min_cpu_threads
            fail_msg: "Not enough CPU threads. Required: {{ min_cpu_threads }}, Available: {{ cpu_threads_result.stdout }}"

        - name: Check RAM
          assert:
            that: (ansible_memtotal_mb / 1024) >= min_ram_gb
            fail_msg: Not enough memory.

        - name: Check disk space
          command: df --output=avail -BG /
          register: disk_output
          changed_when: false
        - name: Parse disk space
          set_fact:
            free_space_gb: "{{ disk_output.stdout_lines[1] | regex_replace('[^0-9]', '') | int }}"

        - name: Assert disk space
          assert:
            that:
              - free_space_gb | int >= min_space_gb | int
            fail_msg: "Not enough disk space. Required: {{ min_space_gb }} GB, Available: {{ free_space_gb }} GB"

        - name: Get hostname and IP
          set_fact:
            hostname: "{{ ansible_hostname }}"
            ip_address: "{{ ansible_default_ipv4.address }}"

        - name: Read site code by hostname
          command: awk -F, -v host="{{ hostname }}" '$1 == host {print $3}' {{ csv_file_linux }}
          register: site_code_result
          changed_when: false
          failed_when: false

        - name: Read site code by IP if hostname not found
          command: awk -F, -v ip="{{ ip_address }}" '$2 == ip {print $3}' {{ csv_file_linux }}
          register: site_code_result_ip
          changed_when: false
          when: site_code_result.stdout == ""

        - name: Set site code
          set_fact:
            site_code: >-
              {{ 
              (site_code_result.stdout | trim)
                  if site_code_result.stdout != ""
                  else (site_code_result_ip.stdout | trim)
              }}

        - name: Get site zip file
          set_fact:
            site_path: "{{ site_mapping[site_code] | default('') }}"

        - name: Fail if site zip not found
          fail:
            msg: No installation package mapped for site code '{{ site_code }}'.
          when: site_path == ""

        - name: Unzip package
          unarchive:
            src: "{{ site_path }}"
            dest: "{{ install_dir }}"
            remote_src: yes

        - name: Make installer executable
          file:
            path: "{{ install_dir }}/UEMS_LinuxAgent.bin"
            mode: '0755'
            state: file

        - name: Run installer
          command: "{{ install_dir }}/UEMS_LinuxAgent.bin -f"
          args:
            chdir: "{{ install_dir }}"

        - name: Modify systemd service
          block:
            - name: Ensure service file exists
              stat:
                path: "{{ service_file }}"
              register: service_stat

            - name: Fail if service file missing
              fail:
                msg: "Service file not found: {{ service_file }}"
              when: not service_stat.stat.exists

            - name: Update or insert CPUQuota
              lineinfile:
                path: "{{ service_file }}"
                regexp: ^CPUQuota=
                line: CPUQuota=50%
                insertafter: ^\[Service\]

            - name: Reload systemd
              systemd:
                daemon_reload: yes

            - name: Restart service
              systemd:
                name: dcservice.service
                state: restarted

        - name: Cleanup installation directory
          file:
            path: "{{ install_dir }}"
            state: absent
