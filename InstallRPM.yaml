- name: Install all RPMs on target host
  hosts: "{{ selected_group }}"
  become: yes
  tasks:
    - name: Find all RPMs in /tmp
      find:
        paths: "/tmp"
        patterns: "*.rpm"
      register: copied_rpms

    - name: Install RPM packages
      yum:
        name: "{{ item.path }}"
        state: present
      loop: "{{ copied_rpms.files }}"

