---
- name: Windows Server Health Check
  hosts: all
  gather_facts: no

  tasks:
    # Fetch the hostname
    - name: Get hostname
      win_shell: hostname
      register: hostname_result

    # Debug raw hostname result
    - name: Debug hostname result
      debug:
        var: hostname_result.stdout

    # Clean up the hostname and define necessary variables
    - name: Clean hostname (remove newline, set variables)
      set_fact:
        clean_hostname: "{{ hostname_result.stdout | trim }}"


    # Verify clean_hostname is set correctly
    - name: Debug clean hostname
      debug:
        var: clean_hostname

    # Example task using clean_hostname
    - name: Save running services to a file
      win_copy:
        content: "Example content using {{ clean_hostname }}"
        dest: "{{ src1 }}"
